name: Daily Project Update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update project file
        run: |
          echo "Last update: $(date -u)" > daily-update.txt

      - name: Commit changes
        run: |
          git config user.name "mubasherdevv"
          git config user.email "whatsappbot11@hotmail.com"

          git add daily-update.txt

          git diff --cached --quiet || \
          git commit -m "chore: automated project update"

          git push

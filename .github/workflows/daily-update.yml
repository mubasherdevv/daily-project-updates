
name: Daily Project Update

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "30 14 * * *"
    - cron: "0 16 * * *"
    - cron: "30 17 * * *"
    - cron: "0 19 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping runs from pushing at the same time
concurrency:
  group: daily-project-update-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Update project file
        run: |
          echo "Last update: $(date -u)" > daily-update.txt

      - name: Commit and push changes
        run: |
          git config user.name "mubasherdevv"
          git config user.email "whatsappbot11@hotmail.com"

          git add daily-update.txt

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: automated project update"
          git push origin main
